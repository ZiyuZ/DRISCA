# 复制为 control.toml。每个动作绑定一个按键名称，unbound 表示未绑定。

[keyboard]
quit = "escape"
toggle_autopilot = "p"
takeover = "backslash"
toggle_reverse = "q"
toggle_manual_transmission = "m"
gear_up = "period"
gear_down = "comma"
toggle_handbrake = "space"
toggle_light_double_blinker = "semicolon"
toggle_light_low_beam = "k"
toggle_light_high_beam = "l"
toggle_light_left_blinker = "z"
toggle_light_right_blinker = "x"
toggle_light_interior = "i"
drive_forward = "w"
drive_backward = "s"
drive_left = "a"
drive_right = "d"

[wheel]
enable_wheel = false
show_button_key = false
autopilot_wheel_sync = false # 保留的方向盘随动设置，功能后续实现
device_index = 0
toggle_autopilot = "dial_press"
takeover = "cross"
toggle_reverse = "left_paddle"
toggle_handbrake = "right_paddle"
toggle_light_left_blinker = "l2"
toggle_light_right_blinker = "r2"
toggle_light_double_blinker = "triangle"
