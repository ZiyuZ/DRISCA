# 另存为 basic.toml，按实验环境调整地图、车辆与相机。
markers = ["进入路段", "离开路段", "任务完成", "异常情况"]

[[instructions]]
id = "takeover"
name = "请求接管"
command = "takeover"
params = { enabled = true, speech = "请接管车辆" }

[world]
map_name = "Town10HD_Opt"
load_map = false
sync_mode = true
simulation_fps = 60

[world.weather]
preset_name = "ClearNoon"
cloudiness = 30.0
wetness = 80.0
precipitation = 80.0
precipitation_deposits = 80.0
wind_intensity = 20.0
dust_storm = 0.0
sun_azimuth_angle = 0.0
sun_altitude_angle = 45.0
fog_density = 0.0
fog_distance = 0.0
fog_falloff = 0.0
scattering_intensity = 0.0
mie_scattering_scale = 0.0
rayleigh_scattering_scale = 0.0331

[ego]
role_name = "hero"
blueprint = ""
default_speed_limit = 33.33
dynamic_speed_limit = false
init_autopilot = false

