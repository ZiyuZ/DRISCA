# 另存为 basic.toml，按实验环境调整地图、车辆与相机。
markers = ["进入路段", "离开路段", "任务完成", "异常情况"]

[[instructions]]
id = "takeover"
name = "请求接管"
command = "takeover"
params = { enabled = true, speech = "请接管车辆" }

[world]
map_name = "Town10HD_Opt"
load_map = false
sync_mode = true
simulation_fps = 60

# preset_name 可改为目录中的预设名（如 "ClearNoon"），启动前展开为完整值；
# 修改任意参数后应改为 "Custom"，此时使用下方数值。
[world.weather]
preset_name = "Custom"
cloudiness = 0.1
wind = 0.1
dust = 0.0

sun = { azimuth_deg = 0.0, elevation_deg = 45.0 }
precipitation = { rain = 0.0, snow = 0.0 }
surface = { wetness = 0.0, puddles = 0.0 }
fog = { density = 0.0, distance_m = 0.0, height_falloff = 0.2 }
scattering = { light = 1.0, mie = 0.003996, rayleigh = 0.0331 }

# 初始局部球雾，可重复添加。中心为世界坐标米，密度 0 到 1。
# [[world.fog_regions]]
# center_m = [10.0, 20.0, 2.0]
# radius_m = 80.0
# density = 0.8
# transition_seconds = 0.0

[ego]
role_name = "hero"
blueprint = ""
default_speed_limit = 33.33
dynamic_speed_limit = false
init_autopilot = false

# 示例出生坐标，使用前请从目标地图选择位置并保存。
[ego.spawn_point]
x = 120.0
y = 30.0
z = 0.5
pitch = 0.0
yaw = 90.0
roll = 0.0

[traffic]
enabled = false
vehicle_count = 0
seed = 42
speed_factor = 1.0
enable_lane_change = true
style = "balanced"
car_following_model = "idm"
lane_change_model = "gap"

[cameras]

[cameras.front]
x = 0.5
y = -0.35
z = 0.8
pitch = 5.8
yaw = 0.0
roll = 0.0
fov = 120.0

[cameras.rear_top]
x = 0.34
y = 0.0
z = 0.7
pitch = 5.8
yaw = 180.0
roll = 0.0
fov = 100.0

[cameras.rear_left]
x = 0.4
y = -0.93
z = 0.5
pitch = 5.8
yaw = 180.0
roll = 0.0
fov = 100.0

[cameras.rear_right]
x = 0.4
