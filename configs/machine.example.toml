# 复制为 machine.toml，填写本机设置。
db_path = "data/experiments.sqlite3"
recorder_dir = "data/recordings"
export_dir = "data/exports"

[carla]
host = "127.0.0.1"
port = 2000
tm_port = 8000
timeout = 5.0

[display]
resolution = [1600, 900]
fullscreen = false
borderless = false
target_fps = 60

[display.layout]
show_rearview = true

[display.layout.rear_top]
screen_position = [0.5, 0.1]
image_size = [320, 150]

[display.layout.rear_left]
screen_position = [0.12, 0.9]
image_size = [320, 150]

[display.layout.rear_right]
screen_position = [0.88, 0.9]
image_size = [320, 150]

[service]
launcher_host = "0.0.0.0"
launcher_port = 7900
enable_tts = true
debug = false
