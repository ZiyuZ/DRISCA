[project]
name = "drisca"
version = "0.1.0"
description = "Driving Simulator based on CARLA"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "ZiyuZ", email = "19648091+ZiyuZ@users.noreply.github.com" }]
dependencies = [
  "fastapi>=0.163.1",
  "logitech-steering-wheel>=1.0",
  "loguru>=0.8.0",
  "matplotlib>=3.10,<4",
  "networkx>=3.5,<4",
  "numpy",
  "pydantic>=2.12,<3",
  "pygame-ce>=2.5.8",
  "pywebview>=6.2.1",
  "pywin32>=312",
  "tomli-w>=1.2,<2",
  "uvicorn>=0.54.0",
  "websockets>=17.4",
]

[dependency-groups]
dev = ["ruff", "ty"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 110
format.quote-style = "single"
lint.select = ["E", "F", "W", "A", "PLC", "PLE", "PLW", "I"]
lint.per-file-ignores = { "**/{tests,docs,tools,scripts}/*" = [
  "E402",  # module-import-not-at-top-of-file
  "E741",  # ambiguous-variable-name
  "PLC0415",  # import-outside-top-level
  "PLW0603",  # global-statement
  "PLW2901",
], "**/*.ipynb" = [
  "F401"  # unused-import
], "**/src/**/*" = [
  "PLC0415",  # import-outside-top-level
] }

[tool.uv]
index = [{ name = "tsinghua", url = "https://pypi.tuna.tsinghua.edu.cn/simple", default = true }, { name = "pytorch-cu130", url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu130", explicit = true }]
